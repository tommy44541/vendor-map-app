name: Sync Google Play Store Icon

on:
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: "Submit the icon change for review when no other changes are already in review."
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sync-icon:
    name: Sync zh-TW store icon
    runs-on: ubuntu-latest
    env:
      PACKAGE_NAME: com.tomslighter.vendormapapp
      LISTING_LANGUAGE: zh-TW
      ICON_PATH: store-assets/google-play/hi-res-icon-512.png

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate store icon
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");
          const path = process.env.ICON_PATH;
          const icon = fs.readFileSync(path);
          const pngSignature = "89504e470d0a1a0a";

          if (icon.subarray(0, 8).toString("hex") !== pngSignature) {
            throw new Error(`${path} must be a PNG image.`);
          }

          const width = icon.readUInt32BE(16);
          const height = icon.readUInt32BE(20);
          if (width !== 512 || height !== 512) {
            throw new Error(`${path} must be 512 x 512 px; received ${width} x ${height}.`);
          }

          const maxBytes = 1024 * 1024;
          if (icon.length > maxBytes) {
            throw new Error(`${path} must be at most 1 MB; received ${icon.length} bytes.`);
          }

          console.log(`Validated ${path}: ${width} x ${height}, ${icon.length} bytes.`);
          NODE

      - name: Create Google Play access token
        id: play_auth
        shell: bash
        env:
          PLAY_STORE_SA_JSON: ${{ secrets.PLAY_STORE_SA_JSON }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const crypto = require("crypto");
          const fs = require("fs");

          const credentials = JSON.parse(process.env.PLAY_STORE_SA_JSON || "{}");
          if (!credentials.client_email || !credentials.private_key) {
            throw new Error("PLAY_STORE_SA_JSON must contain client_email and private_key.");
          }

          const encode = (value) =>
            Buffer.from(JSON.stringify(value)).toString("base64url");
          const issuedAt = Math.floor(Date.now() / 1000);
          const unsignedToken = [
            encode({ alg: "RS256", typ: "JWT" }),
            encode({
              iss: credentials.client_email,
              scope: "https://www.googleapis.com/auth/androidpublisher",
              aud: "https://oauth2.googleapis.com/token",
              iat: issuedAt,
              exp: issuedAt + 3600,
            }),
          ].join(".");
          const signature = crypto
            .sign("RSA-SHA256", Buffer.from(unsignedToken), credentials.private_key)
            .toString("base64url");
          const assertion = `${unsignedToken}.${signature}`;

          const body = new URLSearchParams({
            grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
            assertion,
          });

          fetch("https://oauth2.googleapis.com/token", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body,
          })
            .then(async (response) => {
              const payload = await response.json();
              if (!response.ok || !payload.access_token) {
                throw new Error(
                  `Google OAuth token exchange failed (${response.status}): ${JSON.stringify(payload)}`,
                );
              }

              console.log(`::add-mask::${payload.access_token}`);
              fs.appendFileSync(
                process.env.GITHUB_OUTPUT,
                `access_token=${payload.access_token}\n`,
              );
            })
            .catch((error) => {
              console.error(error);
              process.exit(1);
            });
          NODE

      - name: Replace Play Store icon
        id: sync
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.play_auth.outputs.access_token }}
          SUBMIT_FOR_REVIEW: ${{ inputs.submit_for_review }}
        run: |
          set -euo pipefail

          api="https://androidpublisher.googleapis.com/androidpublisher/v3/applications/${PACKAGE_NAME}"
          upload_api="https://androidpublisher.googleapis.com/upload/androidpublisher/v3/applications/${PACKAGE_NAME}"
          auth_header="Authorization: Bearer ${ACCESS_TOKEN}"

          edit_response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "$auth_header" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "${api}/edits")"
          edit_id="$(jq -r '.id // empty' <<<"$edit_response")"

          if [ -z "$edit_id" ]; then
            echo "Could not resolve the Google Play edit ID." >&2
            exit 1
          fi

          cleanup_edit() {
            curl --silent --show-error \
              --request DELETE \
              --header "$auth_header" \
              "${api}/edits/${edit_id}" >/dev/null || true
          }
          trap cleanup_edit ERR

          images_url="${api}/edits/${edit_id}/listings/${LISTING_LANGUAGE}/icon"
          curl --fail-with-body --silent --show-error \
            --request DELETE \
            --header "$auth_header" \
            "$images_url" >/dev/null

          upload_response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "$auth_header" \
            --header "Content-Type: image/png" \
            --data-binary "@${ICON_PATH}" \
            "${upload_api}/edits/${edit_id}/listings/${LISTING_LANGUAGE}/icon?uploadType=media")"
          image_id="$(jq -r '.image.id // empty' <<<"$upload_response")"

          if [ -z "$image_id" ]; then
            echo "Google Play did not return an uploaded image ID." >&2
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "$auth_header" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "${api}/edits/${edit_id}:validate" >/dev/null

          commit_query="changesNotSentForReview=true&changesInReviewBehavior=ERROR_IF_IN_REVIEW"
          outcome="saved_without_review"
          if [ "$SUBMIT_FOR_REVIEW" = "true" ]; then
            commit_query="changesInReviewBehavior=ERROR_IF_IN_REVIEW"
            outcome="submitted_for_review"
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "$auth_header" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "${api}/edits/${edit_id}:commit?${commit_query}" >/dev/null

          trap - ERR
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        shell: bash
        run: |
          {
            echo "## Google Play Store icon sync"
            echo ""
            echo "- Package: \`${PACKAGE_NAME}\`"
            echo "- Listing language: \`${LISTING_LANGUAGE}\`"
            echo "- Icon: \`${ICON_PATH}\`"
            echo "- Uploaded image ID: \`${{ steps.sync.outputs.image_id }}\`"
            echo "- Result: \`${{ steps.sync.outputs.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
